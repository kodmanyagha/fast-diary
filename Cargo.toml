[package]
name = "fast-diary"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "=1.0.104"
thiserror = "=2.0.20"

druid = { version = "=0.8.3", features = [
  "im",
  "image",
  "png",
  "jpeg",
  "webp",
  "usvg",
] }

druid-widget-nursery = { version = "=0.1.0", features = [
  "async",
  "derive",
  "druid-material-icons",
  "druid-widget-nursery-derive",
  "flume",
  "futures",
  "hot-reload",
  "libloading",
  "material-icons",
  "notify",
  "rand",
  "notify5",
  "tokio",
] }

dotenvy = "=0.15"
log = "=0.4.34"
im = "=15.1.0"

tokio = { version = "=1.53.1", features = [
  "default",
  "rt",
  "time",
  "macros",
  "rt-multi-thread",
] }
futures = { version = "=0.3.34", optional = true }
flume = { version = "=0.12.0", optional = true }

libloading = { version = "=0.9.0", optional = true }
rand = { version = "=0.10.2", optional = true }
tracing = { version = "=0.1.44" }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
druid-material-icons = { version = "=0.2.0", optional = true }
chrono = { version = "=0.4.45", features = ["alloc"] }

homedir = "=0.3.6"
parking_lot = "=0.12.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
dirs = "=6.0.0"
