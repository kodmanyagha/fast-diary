[package]
name = "fast-diary"
version = "0.1.1"
edition = "2021"
authors = ["Emir Buğra Köksalan <kodmanyagha@gmail.com>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/kodmanyagha/fast-diary"
description = "A simple, fast diary app for writing your daily notes in Markdown."

[dependencies]
anyhow = "=1.0.104"
thiserror = "=2.0.21"

druid = { version = "=0.8.3", features = [
  "im",
  "image",
  "png",
  "jpeg",
  "webp",
  "usvg",
] }

druid-widget-nursery = { version = "=0.1.0", features = [
  "async",
  "derive",
  "druid-material-icons",
  "druid-widget-nursery-derive",
  "flume",
  "futures",
  "hot-reload",
  "libloading",
  "material-icons",
  "notify",
  "rand",
  "notify5",
  "tokio",
] }

dotenvy = "=0.15"
log = "=0.4.34"
im = "=15.1.0"

tokio = { version = "=1.53.1", features = [
  "default",
  "rt",
  "time",
  "macros",
  "rt-multi-thread",
] }
futures = { version = "=0.3.34", optional = true }
flume = { version = "=0.12.0", optional = true }

libloading = { version = "=0.9.0", optional = true }
rand = { version = "=0.10.3", optional = true }
tracing = { version = "=0.1.44" }
tracing-subscriber = { version = "=0.3.23", features = ["env-filter"] }
druid-material-icons = "=0.2.0"
chrono = { version = "=0.4.45", features = ["alloc"] }

homedir = "=0.3.6"
parking_lot = "=0.12.5"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
dirs = "=7.0.0"
pulldown-cmark = { version = "=0.13.4", default-features = false }
argon2 = "=0.6.0"
chacha20poly1305 = "=0.11.0"
base64 = "=0.23.1"
getrandom = "=0.4.3"
zeroize = { version = "=1.9.0", features = ["derive"] }

[dev-dependencies]
tempfile = "=3.27.0"

[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[target."cfg(windows)".build-dependencies]
winresource = { version = "=0.1.31", default-features = false }

[package.metadata.deb]
maintainer = "Emir Buğra Köksalan <kodmanyagha@gmail.com>"
copyright = "2026, Emir Buğra Köksalan"
license-file = ["LICENSE", "0"]
extended-description = """\
Fast Diary is a simple, fast diary app for writing your daily notes in \
Markdown, with a calendar view, folder-based encryption and a live preview \
editor."""
depends = "$auto"
section = "utils"
priority = "optional"
assets = [
  [
    "target/release/fast-diary",
    "usr/bin/",
    "755",
  ],
  [
    "resources/fast-diary.desktop",
    "usr/share/applications/",
    "644",
  ],
  [
    "resources/images/icons/fast-diary-16.png",
    "usr/share/icons/hicolor/16x16/apps/fast-diary.png",
    "644",
  ],
  [
    "resources/images/icons/fast-diary-24.png",
    "usr/share/icons/hicolor/24x24/apps/fast-diary.png",
    "644",
  ],
  [
    "resources/images/icons/fast-diary-32.png",
    "usr/share/icons/hicolor/32x32/apps/fast-diary.png",
    "644",
  ],
  [
    "resources/images/icons/fast-diary-48.png",
    "usr/share/icons/hicolor/48x48/apps/fast-diary.png",
    "644",
  ],
  [
    "resources/images/icons/fast-diary-64.png",
    "usr/share/icons/hicolor/64x64/apps/fast-diary.png",
    "644",
  ],
  [
    "resources/images/icons/fast-diary-128.png",
    "usr/share/icons/hicolor/128x128/apps/fast-diary.png",
    "644",
  ],
  [
    "resources/images/icons/fast-diary-256.png",
    "usr/share/icons/hicolor/256x256/apps/fast-diary.png",
    "644",
  ],
  [
    "resources/images/icons/fast-diary-512.png",
    "usr/share/icons/hicolor/512x512/apps/fast-diary.png",
    "644",
  ],
  [
    "resources/images/icons/fast-diary.svg",
    "usr/share/icons/hicolor/scalable/apps/fast-diary.svg",
    "644",
  ],
  [
    "README.md",
    "usr/share/doc/fast-diary/README.md",
    "644",
  ],
]

[package.metadata.generate-rpm]
license = "GPL-3.0-or-later"
assets = [
  { source = "target/release/fast-diary", dest = "/usr/bin/fast-diary", mode = "755" },
  { source = "resources/fast-diary.desktop", dest = "/usr/share/applications/fast-diary.desktop", mode = "644" },
  { source = "resources/images/icons/fast-diary-16.png", dest = "/usr/share/icons/hicolor/16x16/apps/fast-diary.png", mode = "644" },
  { source = "resources/images/icons/fast-diary-24.png", dest = "/usr/share/icons/hicolor/24x24/apps/fast-diary.png", mode = "644" },
  { source = "resources/images/icons/fast-diary-32.png", dest = "/usr/share/icons/hicolor/32x32/apps/fast-diary.png", mode = "644" },
  { source = "resources/images/icons/fast-diary-48.png", dest = "/usr/share/icons/hicolor/48x48/apps/fast-diary.png", mode = "644" },
  { source = "resources/images/icons/fast-diary-64.png", dest = "/usr/share/icons/hicolor/64x64/apps/fast-diary.png", mode = "644" },
  { source = "resources/images/icons/fast-diary-128.png", dest = "/usr/share/icons/hicolor/128x128/apps/fast-diary.png", mode = "644" },
  { source = "resources/images/icons/fast-diary-256.png", dest = "/usr/share/icons/hicolor/256x256/apps/fast-diary.png", mode = "644" },
  { source = "resources/images/icons/fast-diary-512.png", dest = "/usr/share/icons/hicolor/512x512/apps/fast-diary.png", mode = "644" },
  { source = "resources/images/icons/fast-diary.svg", dest = "/usr/share/icons/hicolor/scalable/apps/fast-diary.svg", mode = "644" },
  { source = "README.md", dest = "/usr/share/doc/fast-diary/README.md", mode = "644", doc = true },
]
